name: Deploy Guide
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - run: |
          git config user.name "Archana Panda"
          git config user.email "103558334+archanacontent@users.noreply.github.com"
          mkdocs gh-deploy --force
